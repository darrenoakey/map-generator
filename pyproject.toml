[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "map-generator"
version = "0.1.0"
description = "Google Maps URL → 3D-printable STL"
authors = [{name = "Darren", email = "darren.oakey@gmail.com"}]
readme = "README.md"
license = {text = "CC BY-NC-4.0"}
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "trimesh>=4.1.0",
    "rasterio>=1.3.0",
    "click>=8.1.0",
    "matplotlib>=3.8.0",
    "numpy-stl>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
map-generator = "map_generator.cli:main"

[tool.poetry]
packages = [{include = "map_generator"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: marks tests that require network access (run with -m network)",
]
