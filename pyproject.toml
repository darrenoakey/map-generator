[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "map-generator"
version = "0.1.0"
description = "Convert Google Maps URLs to 3D-printable STL models"
authors = [{name = "Darren Oakey", email = "darren.oakey@gmail.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "requests>=2.31.0",
    "trimesh>=4.12.0",
]

[project.optional-dependencies]
repair = ["pymeshlab>=2023.12"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
map-generator = "map_generator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: marks tests that require network access",
]
